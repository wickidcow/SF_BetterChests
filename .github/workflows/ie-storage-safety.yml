name: IE Storage Safety

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify IE storage fail-closed invariants
        run: python3 scripts/verify_ie_storage_safety.py .
      - name: Compile BetterChests
        run: mvn --batch-mode --update-snapshots clean test
