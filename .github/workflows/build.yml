name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build jar
        run: mvn --batch-mode --update-snapshots clean package

      - name: Stage versioned Legacy JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="$(find target -maxdepth 1 -type f -name 'BetterChests-Albion-*.jar' ! -name 'original-*' -print -quit)"
          test -n "$JAR"
          OUTPUT="dist/SF_BetterChests_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          cp "$JAR" "$OUTPUT"
          test -s "$OUTPUT"
          sha256sum "$OUTPUT"

      - name: Upload direct versioned Legacy JAR
        uses: actions/upload-artifact@v7
        with:
          path: dist/SF_BetterChests_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          archive: false
          if-no-files-found: error

      - name: Publish direct JAR release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          JAR="dist/SF_BetterChests_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --generate-notes --title "BetterChests $TAG"
          fi
