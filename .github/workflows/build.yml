name: Build BetterChests

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.0.3"
  OUTPUT_NAME: "SF_BetterChests1.0.3.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      output_name: ${{ steps.jar-meta.outputs.output_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_BetterChests${VERSION}.jar"
          PROJECT_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$PROJECT_VERSION" = "$VERSION"
      - name: Verify Doctor drawer migration safety
        run: python3 scripts/verify_doctor_drawers.py .
      - name: Test immutable release policy (no GitHub writes)
        run: python3 -m unittest discover -s scripts -p 'test_publish_immutable_release.py' -v
      - name: Test stable Paper 26.3 source/runtime matrix
        run: python3 -m unittest discover -s scripts -p 'test_paper_26_3_api.py' -v
      - name: Build release JAR against Paper 1.21.11 baseline
        run: mvn --batch-mode --update-snapshots clean package
      - name: Stage versioned JAR
        id: jar-meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/${OUTPUT_NAME}"
          test -s "$JAR"
          cp "$JAR" "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
          echo "output_name=${OUTPUT_NAME}" >> "$GITHUB_OUTPUT"
      - name: Verify Paper 26.2 compilation and tests
        run: mvn --batch-mode --update-snapshots -Dpaper.version=26.2.build.129-stable clean verify
      - name: Verify Paper 26.3 compilation and tests
        run: mvn --batch-mode --update-snapshots -Dpaper.version=26.3.build.205-stable clean verify
      - name: Verify release metadata and Java 21 bytecode
        shell: bash
        run: |
          set -euo pipefail
          JAR="dist/${OUTPUT_NAME}"
          unzip -p "$JAR" plugin.yml | tee /tmp/betterchests-plugin.yml
          grep -F "name: BetterChests" /tmp/betterchests-plugin.yml
          grep -F "version: '${VERSION}'" /tmp/betterchests-plugin.yml || grep -F "version: ${VERSION}" /tmp/betterchests-plugin.yml
          if grep -Eiq '^version:.*(legacy|english|snapshot)' /tmp/betterchests-plugin.yml; then exit 1; fi
          grep -F "api-version: '1.21.11'" /tmp/betterchests-plugin.yml
          javap -verbose -classpath "$JAR" me.mmmjjkx.betterChests.BetterChests | grep -F "major version: 65"
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

  runtime-test:
    name: Paper ${{ matrix.paper_version }} + Slimefun Legacy Runtime Smoke
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        paper_version:
          - '1.21.11'
          - '26.2'
          - '26.3'
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare plugin directory
        run: mkdir -p server/plugins/_artifact
      - name: Download validated BetterChests JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.output_name }}
          path: server/plugins/_artifact
      - name: Normalize and verify downloaded plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_NAME='${{ needs.build.outputs.output_name }}'
          DOWNLOADED="$(find server/plugins/_artifact -type f -name '*.jar' -print -quit)"
          test -n "$DOWNLOADED"
          mv "$DOWNLOADED" "server/plugins/$OUTPUT_NAME"
          rm -rf server/plugins/_artifact
          test -s "server/plugins/$OUTPUT_NAME"
          unzip -tqq "server/plugins/$OUTPUT_NAME"
      - name: Download stable Paper and Slimefun Legacy
        shell: bash
        env:
          PAPER_VERSION: ${{ matrix.paper_version }}
        run: |
          set -euo pipefail
          USER_AGENT='SF_BetterChests-CI (github.com/wickidcow/SF_BetterChests)'
          PAPER_BUILDS=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H "User-Agent: ${USER_AGENT}" "https://fill.papermc.io/v3/projects/paper/versions/${PAPER_VERSION}/builds")
          PAPER_URL=$(echo "${PAPER_BUILDS}" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')
          if [ -z "${PAPER_URL}" ]; then echo "No stable Paper ${PAPER_VERSION} build returned." >&2; exit 1; fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H "User-Agent: ${USER_AGENT}" -o server/paper.jar "${PAPER_URL}"
          SFL_RELEASE=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Accept: application/vnd.github+json' -H "User-Agent: ${USER_AGENT}" https://api.github.com/repos/wickidcow/Slimefun-Legacy/releases/latest)
          SFL_URL=$(echo "${SFL_RELEASE}" | jq -r '.assets[] | select(.name | startswith("Slimefun-Legacy") and endswith(".jar")) | .browser_download_url' | head -n 1)
          if [ -z "${SFL_URL}" ] || [ "${SFL_URL}" = 'null' ]; then exit 1; fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H "User-Agent: ${USER_AGENT}" -o server/plugins/Slimefun.jar "${SFL_URL}"
      - name: Start Paper and verify plugin enable
        shell: bash
        run: |
          set -euo pipefail
          cd server
          echo 'eula=true' > eula.txt
          java -Xms512M -Xmx1G -jar paper.jar --nogui > console.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "${SERVER_PID}" 2>/dev/null || true; wait "${SERVER_PID}" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 120); do
            if grep -q 'Done (' console.log 2>/dev/null; then READY=1; break; fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then break; fi
            sleep 1
          done
          cat console.log
          if [ "${READY}" -ne 1 ]; then exit 1; fi
          if grep -Eiq "Unsupported API version|Error occurred while enabling BetterChests|Could not load.*BetterChests|NoClassDefFoundError.*betterChests|NoSuchMethodError.*betterChests" console.log; then exit 1; fi
          grep -q 'BetterChests' console.log

  release:
    name: Publish canonical raw JAR release asset
    needs: [build, runtime-test]
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare release directory
        run: mkdir -p dist/_artifact
      - name: Download validated JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.output_name }}
          path: dist/_artifact
      - name: Normalize downloaded release JAR
        shell: bash
        run: |
          set -euo pipefail
          DOWNLOADED="$(find dist/_artifact -type f -name '*.jar' -print -quit)"
          test -n "$DOWNLOADED"
          mv "$DOWNLOADED" "dist/${OUTPUT_NAME}"
          rm -rf dist/_artifact
          test -s "dist/${OUTPUT_NAME}"
      - name: Publish distinct manually approved immutable release only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/publish_immutable_release.sh
